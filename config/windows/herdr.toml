onboarding = false
[theme]
name = "tokyo-night"
[terminal]
default_shell = "pwsh.exe"
new_cwd = "follow"
[session]
resume_agents_on_restore = false
[experimental]
allow_nested = false
[ui]
copy_on_select = true
mouse_capture = true
[ui.sidebar.agents]
row_gap = 1
rows = [[{ token = "$role", bold = true, fg = "#7AA2F7" }], ["$limit"]]
[ui.toast]
delivery = "herdr"
[ui.toast.herdr]
position = "bottom-left"
